- aid: university-of-bath:primo-discovery
  name: Library Discovery (Ex Libris Primo)
  description: >-
    The University of Bath library catalogue runs on Ex Libris Alma with the Primo discovery service.
    Primo VE exposes search/discovery interfaces (Primo REST/Search APIs) typically requiring an Ex Libris
    API key; the public Primo front end at bath.primo.exlibrisgroup.com resolves (HTTP 200).
  humanURL: https://www.bath.ac.uk/guides/using-the-library-catalogue/
  baseURL: https://bath.primo.exlibrisgroup.com/

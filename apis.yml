description: >-
  The University of Bath is a public research university in Bath, United Kingdom, and a member
  of the Russell Group. It operates no public developer program: a full crawl of its 21,530-URL
  sitemap on 2026-08-30 returned no developer portal, no API reference, and no published OpenAPI
  under any bath.ac.uk path. Its one genuinely institution-operated machine-readable surface is
  the Research Data Archive at researchdata.bath.ac.uk — EPrints 3.4.7 running on the University's
  own infrastructure (138.38.44.144) — which serves a live OAI-PMH 2.0 interface, an EPrints
  REST/XML interface, and DataCite kernel-4 records carrying ORCID identifiers and DOIs under the
  University's own 10.15125 prefix. Everything else that appears to be a Bath API is a vendor
  contract running under a Bath hostname: purehost.bath.ac.uk and researchportal.bath.ac.uk both
  CNAME to bath-prod.elsevierpure.com and are an Elsevier Pure tenancy; the library catalogue is
  an Ex Libris Alma/Primo tenancy; library.bath.ac.uk is Springshare LibGuides; status.bath.ac.uk
  is Better Stack. The programme and unit catalogue is entirely behind CAS authentication at
  auth.bath.ac.uk, and the student records system behind Microsoft Entra ID. An Azure API
  Management portal exists only as a non-production "test" instance and is not recorded as a
  surface. This profile is deliberately thin because the footprint is thin.
